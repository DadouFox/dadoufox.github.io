            <a href="index.html" title="Accueil">Accueil</a>

            <a href="contact.html" title="Me contacter">Contact</a>
            <a href="cursus.html" title="Mon cursus scolaire">Cursus Scolaire</a>
            <a href="projects.html" title="Mes projets">Projets</a>
            <a href="CV Damien_Gauthier.pdf" title="Télécharger mon CV" class="cv-download" download>Télécharger le CV</a>
        </nav>
    </header>

    <main>
        <h1 id="contact-title">Contact</h1>

        <div class="contact-layout">
            <section class="contact-page-panel">
                <h2>Retrouvez-moi</h2>
                <ul>
                    <li><img src="images/icons/gmail.svg" alt="Email" class="contact-icon"> Email : <a href="mailto:Damien.GAUTHIER2@etu.uca.fr">Damien.GAUTHIER2@etu.uca.fr</a></li>
                    <li><img src="images/icons/telephone.svg" alt="Téléphone" class="contact-icon"> Téléphone : 06 86 98 74 72</li>
                    <li><img src="images/icons/gitlab.svg" alt="GitLab" class="contact-icon"> GitLab : <a href="https://codefirst.iut.uca.fr/gitlab/dagauthier">dagauthier</a></li>
                    <li><img src="images/icons/github.svg" alt="GitHub" class="contact-icon"> GitHub : <a href="https://github.com/DadouFox">damien_gauthier</a></li>
                </ul>
            </section>

            <section class="contact-form-panel">
                <h2>Envoyer un message</h2>
                <form action="https://formsubmit.co/dadou.g2006@gmail.com" method="post" accept-charset="UTF-8">
                    <input type="hidden" name="_subject" value="Nouveau message depuis le portfolio">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <label for="contact-name">Nom</label>
                    <input type="text" id="contact-name" name="Nom" required>

                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="Email" required>

                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="Message" rows="6" required></textarea>

                    <button type="submit">Envoyer</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        2025 - Portfolio réalisé par Damien GAUTHIER.
    </footer>
</body>
</html>
